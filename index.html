<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Foodnati | Map Ride</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
#foodnatiScene{position:fixed;inset:0;display:grid;place-items:center;background:#fff}
.map-viewport{position:relative;width:min(78vw,330px);height:min(78vw,330px);max-height:44dvh;overflow:hidden;mask-image:radial-gradient(ellipse 68% 68% at center,#000 55%,transparent 100%);-webkit-mask-image:radial-gradient(ellipse 68% 68% at center,#000 55%,transparent 100%)}
.map-world{position:absolute;left:0;top:0;width:700px;height:auto;max-width:none;will-change:transform;user-select:none;pointer-events:none}
.bike{position:absolute;left:50%;top:50%;width:54px;height:74px;object-fit:contain;transform:translate(-50%,-50%);transform-origin:center;filter:drop-shadow(0 2px 2px #0002);will-change:transform;pointer-events:none}
@media(max-width:400px){.bike{width:48px;height:66px}}
@media(prefers-reduced-motion:reduce){.bike,.map-world{will-change:auto}}
</style>
</head>
<body>
<div id="foodnatiScene" aria-label="Foodnati bike riding along a map route">
  <div class="map-viewport" id="mapViewport">
    <img class="map-world" id="mapWorld" src="map.png" alt="" draggable="false">
    <img class="bike" id="bike" src="bike.png" alt="Foodnati pink delivery bike" draggable="false">
  </div>
</div>
<script>
(()=>{
  const world=document.getElementById('mapWorld');
  const bike=document.getElementById('bike');
  const viewport=document.getElementById('mapViewport');
  // Coordinates measured on map.png (1286 x 1223): vertical road to right-hand road.
  const scale=700/1286;
  const cx=610, intersectionY=587, startY=1030, finishX=1110;
  const radius=45;
  const straight1=startY-(intersectionY+radius);
  const turnLength=Math.PI*radius/2;
  const straight2=finishX-(cx+radius);
  const total=straight1+turnLength+straight2;
  const duration=9000;
  let started;
  function render(now){
    if(started===undefined)started=now;
    const p=((now-started)%duration)/duration;
    const d=p*total;
    let x,y,angle;
    if(d<straight1){
      x=cx;y=startY-d;angle=0;
    }else if(d<straight1+turnLength){
      const theta=(d-straight1)/radius;
      x=cx+radius*(1-Math.cos(theta));
      y=intersectionY+radius-radius*Math.sin(theta);
      angle=theta*180/Math.PI;
    }else{
      x=cx+radius+(d-straight1-turnLength);
      y=intersectionY;
      angle=90;
    }
    const w=viewport.clientWidth,h=viewport.clientHeight;
    world.style.transform=`translate3d(${w/2-x*scale}px,${h/2-y*scale}px,0)`;
    bike.style.transform=`translate(-50%,-50%) rotate(${angle}deg)`;
    // Disguise the jump when the animation repeats.
    const alpha=p<.06?p/.06:p>.94?(1-p)/.06:1;
    bike.style.opacity=String(Math.min(1,Math.max(0,alpha)));
    requestAnimationFrame(render);
  }
  function staticFrame(){
    world.style.transform=`translate3d(${viewport.clientWidth/2-cx*scale}px,${viewport.clientHeight/2-startY*scale}px,0)`;
    bike.style.opacity='1';
  }
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){staticFrame();window.addEventListener('resize',staticFrame)}
  else requestAnimationFrame(render);
})();
</script>
</body>
</html>
